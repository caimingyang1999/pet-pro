# =====================================================
# 测试/开发环境配置（application-dev.yml）
# 对应 Maven profile: dev（默认激活）
# 打包命令: mvn clean package -Pdev 或 mvn clean package
# =====================================================

# Ruoyi 基础配置（覆盖 application.yml 里的默认 Linux 路径）
ruoyi:
  # 文件上传根目录：开发环境优先使用环境变量 UPLOAD_PATH；
  #   - Windows 开发者: 形如 D:/ruoyi/uploadPath
  #   - Mac/Linux 开发者: 形如 ~/ruoyi/uploadPath 或 /tmp/ruoyi/uploadPath
  # 未设置 UPLOAD_PATH 时按当前操作系统给出一个默认可用的目录，避免上传失败
  profile: ${UPLOAD_PATH:${user.home}/ruoyi/uploadPath}

# 服务端口
server:
  port: 8080

spring:
  # 数据源（测试环境 - 本地 Docker MySQL，端口 3307，密码 mysqltest）
  datasource:
    druid:
      master:
        url: jdbc:mysql://127.0.0.1:3307/pet-profile?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_PASSWORD:mysqltest}
      # 测试环境可临时开启 Druid 监控台
      statViewServlet:
        enabled: true

  # Redis（测试环境 - 本地 Docker Redis，无密码）
  redis:
    host: 127.0.0.1
    port: 6379
    password: ${REDIS_PASSWORD:}

  # 热部署（开发环境开启）
  devtools:
    restart:
      enabled: true

# Swagger（测试环境开启）
swagger:
  enabled: true

# Druid 监控台账号（仅测试环境）
druid:
  username: ${DRUID_USERNAME:ruoyi}
  password: ${DRUID_PASSWORD:123456}
