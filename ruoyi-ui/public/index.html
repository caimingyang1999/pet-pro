<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= webpackConfig.name %></title>
    <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
	  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }
    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    /* ==========================================================
       启动加载遮罩（深空极光风格，与登录页保持一致）
       说明：该遮罩位于 #app 内部，Vue 挂载后会随内容整体替换而消失，
             因此无需额外的移除脚本。
       ========================================================== */
    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(130% 110% at 50% -10%, #0C1430 0%, #060A16 46%, #03050C 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }

    /* 背景点阵网格（中心向外淡出） */
    #loader-wrapper .loader-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.13) 1px, transparent 1px);
      background-size: 36px 36px;
      -webkit-mask-image: radial-gradient(circle at 50% 48%, #000 0%, rgba(0,0,0,.35) 52%, transparent 78%);
      mask-image: radial-gradient(circle at 50% 48%, #000 0%, rgba(0,0,0,.35) 52%, transparent 78%);
      opacity: .7;
    }

    /* 四周压暗，突出中心内容 */
    #loader-wrapper .loader-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(115% 95% at 50% 50%, transparent 40%, rgba(0, 0, 0, .55) 100%);
    }

    /* 极光光晕（screen 混合，叠加处提亮而非发灰） */
    #loader-wrapper .a-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(64px);
      mix-blend-mode: screen;
    }
    #loader-wrapper .a-orb-1 {
      width: 500px; height: 500px; top: -180px; left: -140px;
      background: radial-gradient(circle, rgba(255,108,36,.85) 0%, rgba(255,108,36,0) 70%);
      animation: loaderDriftA 16s ease-in-out infinite;
    }
    #loader-wrapper .a-orb-2 {
      width: 460px; height: 460px; bottom: -180px; right: -130px;
      background: radial-gradient(circle, rgba(84,82,255,.75) 0%, rgba(84,82,255,0) 72%);
      animation: loaderDriftB 21s ease-in-out infinite;
    }
    #loader-wrapper .a-orb-3 {
      width: 340px; height: 340px; bottom: 6%; left: 6%;
      background: radial-gradient(circle, rgba(0,214,255,.4) 0%, rgba(0,214,255,0) 72%);
      animation: loaderDriftB 26s ease-in-out infinite reverse;
    }

    /* 中心内容 */
    #loader-wrapper .loader-core {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: loaderIn .8s cubic-bezier(.16, 1, .3, 1) both;
    }

    /* 爪印 + 双环旋转 */
    #loader {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loader .paw {
      width: 52px;
      height: 52px;
      fill: #FF8A47;
      filter: drop-shadow(0 0 14px rgba(255, 126, 61, .65));
      animation: pawBeat 1.6s ease-in-out infinite;
    }
    #loader .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .08);
      border-top-color: #FF7E3D;
      animation: loaderSpin 1.1s linear infinite;
    }
    #loader .ring-inner {
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: rgba(255, 178, 94, .55);
      animation: loaderSpin 1.7s linear infinite reverse;
    }

    /* 标题与提示 */
    #loader-wrapper .loader-title {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #F2F5FA;
    }
    #loader-wrapper .loader-bar {
      position: relative;
      width: 190px;
      height: 3px;
      margin: 20px auto 16px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
    }
    #loader-wrapper .loader-bar i {
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #FF7E3D 45%, #FFB25E 60%, transparent);
      animation: loaderBar 1.3s ease-in-out infinite;
    }
    #loader-wrapper .load_title {
      margin: 0;
      color: rgba(255, 255, 255, .42);
      font-size: 13px;
      line-height: 30px;
      letter-spacing: 1px;
    }

    @keyframes loaderSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes pawBeat {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%      { transform: scale(.88);  opacity: .78; }
    }
    @keyframes loaderBar {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    @keyframes loaderDriftA {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50%      { transform: translate3d(70px, 55px, 0) scale(1.15); }
    }
    @keyframes loaderDriftB {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1.08); }
      50%      { transform: translate3d(-80px, -50px, 0) scale(.94); }
    }
    @keyframes loaderIn {
      from { opacity: 0; transform: translate3d(0, 16px, 0); }
      to   { opacity: 1; transform: none; }
    }

    /* 尊重系统「减少动态效果」偏好 */
    @media (prefers-reduced-motion: reduce) {
      #loader-wrapper .a-orb,
      #loader .ring,
      #loader .ring-inner,
      #loader .paw,
      #loader-wrapper .loader-bar i,
      #loader-wrapper .loader-core {
        animation: none !important;
      }
    }
  </style>
  </head>
  <body>
    <div id="app">
	    <div id="loader-wrapper">
        <span class="a-orb a-orb-1"></span>
        <span class="a-orb a-orb-2"></span>
        <span class="a-orb a-orb-3"></span>
        <div class="loader-grid"></div>
        <div class="loader-vignette"></div>
		    <div class="loader-core">
          <div id="loader">
            <span class="ring"></span>
            <span class="ring-inner"></span>
            <svg class="paw" viewBox="0 0 120 120" aria-hidden="true">
              <ellipse cx="60" cy="80" rx="30" ry="26" />
              <ellipse cx="26" cy="52" rx="11" ry="14" transform="rotate(-18 26 52)" />
              <ellipse cx="46" cy="33" rx="11" ry="15" transform="rotate(-8 46 33)" />
              <ellipse cx="74" cy="33" rx="11" ry="15" transform="rotate(8 74 33)" />
              <ellipse cx="94" cy="52" rx="11" ry="14" transform="rotate(18 94 52)" />
            </svg>
          </div>
          <h1 class="loader-title"><%= webpackConfig.name %></h1>
          <div class="loader-bar"><i></i></div>
          <p class="load_title">正在加载系统资源，请耐心等待</p>
        </div>
		</div>
	</div>
  </body>
</html>
